<section class="widget-box hub-box" [style.background]="bg()" [style.width.px]="widget.width"
         [style.height.px]="widget.height || null"
         appDrag [appDragTarget]="widget" [appDragZoom]="zoomLevel">

  <app-widget-header [widget]="widget" [showLink]="true"
                     (link)="link.emit($event)" (duplicate)="duplicate.emit($event)"
                     (remove)="remove.emit($event)"></app-widget-header>

  @if (!widget.minimize) {
    <main class="widget-content terminal-body" [class.scaled]="!!widget.height"
          (pointerdown)="$event.stopPropagation()">
      @if (connectedWidgets.length > 0) {
        @for (cw of connectedWidgets; track cw.id) {
          <div class="terminal-id-row">LINK: {{ cw.id }} &middot; {{ cw.title }}</div>
        }
      } @else {
        <div class="terminal-empty">[VUOTO]</div>
      }
    </main>
  }

  <div class="resize-handle" appResize [appResizeTarget]="widget" [appResizeZoom]="zoomLevel"></div>
</section>
